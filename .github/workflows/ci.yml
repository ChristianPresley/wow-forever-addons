name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Addon lint and core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - run: npm ci
      - run: npm test
      - run: npm run build:marketplace

  app:
    name: Desktop app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - run: cargo test --manifest-path client/Cargo.toml -p wfam-core
      - run: cargo build --manifest-path client/Cargo.toml -p forever-addon-manager
