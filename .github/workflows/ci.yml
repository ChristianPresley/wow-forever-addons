name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Addon lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo dev lint
      - run: cargo test -p wfam-core -p wfam-dev
      - run: cargo dev marketplace

  app:
    name: Desktop app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p wfam-core -p wfam-dev
      - run: cargo build -p forever-addon-manager
