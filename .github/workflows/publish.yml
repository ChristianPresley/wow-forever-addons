name: Publish marketplace

# Builds the addon packages and the index, and uploads them to the rolling
# "marketplace" release. The addon manager reads the index from that release.

on:
  push:
    branches: [main]
    paths:
      - 'addons/**'
      - 'tools/**'
      - 'client/core/**'
      - 'Cargo.lock'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-marketplace
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The manager installs what this job uploads without a question, so the same checks
      # as in the CI run first.
      - run: cargo dev lint
      - run: cargo dev conformance
      # Each addon is tested on its own. An addon whose tests fail is held back: it keeps the
      # version that is published now, and the other addons are published.
      - name: Test each addon
        run: |
          : > held.txt
          for dir in addons/*/; do
            folder=$(basename "$dir")
            if ! cargo dev test "$folder"; then
              echo "$folder" >> held.txt
            fi
          done
      - name: Fetch the marketplace that is published now
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view marketplace >/dev/null 2>&1 || gh release create marketplace \
            --title "Addon marketplace" \
            --notes "Packages and index for the Forever Addon Manager. This release is updated automatically." \
            --latest=false
          mkdir published
          # The index, and the package of each addon that the index names. The first run has none.
          if gh release download marketplace --dir published --pattern index.json; then
            jq -r '.addons[].download.url' published/index.json | while read -r package; do
              gh release download marketplace --dir published --pattern "$package"
            done
          fi
      # Fails if the files of an addon changed and its version did not: the manager finds
      # an update by the version, so that change would not reach anyone. A held addon is
      # left out and keeps its published entry.
      # The output is kept, so the last step sees every addon that was held back.
      - name: Build the marketplace
        run: |
          set -o pipefail
          cargo dev marketplace --published published --hold "$(paste -sd, held.txt)" | tee build.txt
      - name: Upload to the marketplace release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The packages first and the index last, so the index never names a package
          # that is not there yet.
          gh release upload marketplace dist/marketplace/*.zip --clobber
          gh release upload marketplace dist/marketplace/index.json --clobber
      - name: Remove the packages that the index no longer names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # After the new index is up, so a manager that read the old index a moment ago
          # can still find its packages until then. Only ZIP files, and never one that the
          # new index names.
          jq -r '.addons[].download.url' dist/marketplace/index.json | sort > named.txt
          gh release view marketplace --json assets --jq '.assets[].name' | grep '\.zip$' | sort > uploaded.txt
          comm -23 uploaded.txt named.txt | while read -r package; do
            echo "Removing $package"
            gh release delete-asset marketplace "$package" --yes
          done
      # The other addons are published above. This step makes the run fail, so the held addon
      # is seen in the list of runs.
      - name: Report the addons that were held back
        run: |
          # The build reports each held addon with "held back": a failing test or changed files.
          held=$(grep ' held back' build.txt | cut -d' ' -f1 | paste -sd' ' -)
          if [ -n "$held" ]; then
            echo "::error::Held back: $held. The others were published."
            exit 1
          fi
