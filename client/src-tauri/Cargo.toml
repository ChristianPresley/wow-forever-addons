[package]
name = "forever-addon-manager"
description = "Finds World of Warcraft: Forever installs and installs or updates addons from the marketplace."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
wfam-core = { path = "../core" }
